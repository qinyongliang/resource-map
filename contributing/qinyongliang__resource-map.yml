description:
  en: Project-local linked Markdown graph of resources, notes, timelines and other related data under .resource-map, with two Agent tools and a conversation-side graph panel; initialization also writes the same CLI into the project so a runtime without DSH can still validate and query it.
  zh: 把项目相关的资源、笔记、时间线及其它关联数据整理成 .resource-map 下可链接的 Markdown 关系图，提供两个 Agent 工具和会话侧关系图面板；初始化还会把同一份 CLI 写入项目，脱离 DSH 也能校验和查询。
